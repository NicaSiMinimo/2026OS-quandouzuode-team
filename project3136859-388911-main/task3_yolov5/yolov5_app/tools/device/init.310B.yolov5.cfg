{
  "jobs": [
    {
      "name": "post-fs-data",
      "cmds": ["exec /system/bin/sh /vendor/etc/install_cann_runtime.sh"]
    },
    {
      "name": "param:yolo_acl_service.boot_completed",
      "condition": "bootevent.boot.completed=true",
      "cmds": ["start yolo_acl_service"]
    }
  ],
  "services": [
    {
      "name": "yolo_acl_service",
      "start-mode": "condition",
      "path": ["/system/bin/sh", "/vendor/etc/run_yolo_acl_service.sh"],
      "sandbox": 0,
      "uid": "HwHiAiUser",
      "gid": ["HwHiAiUser", "HwBaseUser", "HwDmUser"],
      "once": 0,
      "disabled": 0
    }
  ]
}
